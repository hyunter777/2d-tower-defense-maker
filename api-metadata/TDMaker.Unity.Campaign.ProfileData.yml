  name: ProfileData
  nameWithType: ProfileData
  fullName: TDMaker.Unity.Campaign.ProfileData
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Campaign
  summary: 'Everything one save slot stores: opened levels with best stars, victories not yet merged into the map, purchased

    permanent upgrade ranks per track, stars spent on them, and free game-specific entries. App settings (volumes,

    language) are not part of a slot; they stay in <xref href="TDMaker.Unity.View.TDGameSettings" data-throw-if-not-resolved="false"></xref>.
    Serialized with

    <xref href="UnityEngine.JsonUtility" data-throw-if-not-resolved="false"></xref> by <xref href="TDMaker.Unity.Campaign.ProfileSerializer"
    data-throw-if-not-resolved="false"></xref>; <xref href="TDMaker.Unity.Campaign.ProfileData.version" data-throw-if-not-resolved="false"></xref>
    drives migrations.'
