- uid: TDMaker.Editor.TextMeshProSetup.MissingMessage
  commentId: F:TDMaker.Editor.TextMeshProSetup.MissingMessage
  id: MissingMessage
  parent: TDMaker.Editor.TextMeshProSetup
  langs:
  - csharp
  - vb
  name: MissingMessage
  nameWithType: TextMeshProSetup.MissingMessage
  fullName: TDMaker.Editor.TextMeshProSetup.MissingMessage
  type: Field
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: Message logged (and shown) when the essentials are missing.
  example: []
  syntax:
    content: public const string MissingMessage = "[2D Tower Defense Maker] TextMesh Pro Essential Resources are not imported,
      so HUD and menu text cannot render. Import them with Tools > 2D Tower Defense Maker > Import TMP Essential Resources
      (or Window > TextMeshPro > Import TMP Essential Resources)."
    return:
      type: System.String
    content.vb: Public Const MissingMessage As String = "[2D Tower Defense Maker] TextMesh Pro Essential Resources are not
      imported, so HUD and menu text cannot render. Import them with Tools > 2D Tower Defense Maker > Import TMP Essential
      Resources (or Window > TextMeshPro > Import TMP Essential Resources)."
- uid: TDMaker.Editor.TextMeshProSetup.ImportEssentials
  commentId: M:TDMaker.Editor.TextMeshProSetup.ImportEssentials
  id: ImportEssentials
  parent: TDMaker.Editor.TextMeshProSetup
  langs:
  - csharp
  - vb
  name: ImportEssentials()
  nameWithType: TextMeshProSetup.ImportEssentials()
  fullName: TDMaker.Editor.TextMeshProSetup.ImportEssentials()
  type: Method
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Imports the TextMesh Pro Essential Resources silently. The import finishes asynchronously; in batch mode

    (<code>-batchmode -executeMethod TDMaker.Editor.TextMeshProSetup.ImportEssentials</code>, <b>without</b> <code>-quit</code>)

    the editor exits by itself when it is done (exit code 1 on failure).'
  example: []
  syntax:
    content: '[MenuItem("Tools/2D Tower Defense Maker/Import TMP Essential Resources", priority = 902)]

      public static void ImportEssentials()'
    content.vb: '<MenuItem("Tools/2D Tower Defense Maker/Import TMP Essential Resources", priority:=902)>

      Public Shared Sub ImportEssentials()'
  overload: TDMaker.Editor.TextMeshProSetup.ImportEssentials*
  attributes:
  - type: UnityEditor.MenuItem
    ctor: UnityEditor.MenuItem.#ctor(System.String)
    arguments:
    - type: System.String
      value: Tools/2D Tower Defense Maker/Import TMP Essential Resources
    namedArguments:
    - name: priority
      type: System.Int32
      value: 902
