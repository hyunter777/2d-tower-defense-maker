  name: GameHud
  nameWithType: GameHud
  fullName: TDMaker.Unity.Hud.GameHud
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Hud
  summary: 'Production HUD for PC (mouse + keyboard), built in uGUI from code and styled by a <xref href="TDMaker.Unity.Hud.HudTheme"
    data-throw-if-not-resolved="false"></xref>:

    top bar (gold, lives, wave, pause, speed), wave-call indicators at path entrances (countdown ring, early bonus),

    radial build menu, tower panel (upgrades, branches, abilities, target priority, rally, sell), hero portraits,

    spell bar with cooldowns and hotkeys, unit info, pause and victory/defeat screens, tooltips and world feedback

    (range ellipses, slot highlight, placement ghost, rally/move markers, spell aim).

    Interaction follows the input grammar of spec 14 (docs/specs/14-input-grammar.md): one selection or aiming state at a

    time; a battlefield left click acts at the release point; while a hero, rally point or spell is being aimed every

    battlefield click is a point attempt (valid: act and return to browsing; invalid: feedback and keep aiming); build,

    upgrade, branch, ability, sell and wave call are single clicks; right click cancels everything (and does nothing

    without a selection); Esc cancels a selection, otherwise opens/closes the pause menu. Failed or cancelled aims send

    no command and every result shown is read back from the simulation.

    Keys: Esc cancel/pause, Space/P pause, 1-9 spells, H hero, N next wave, F1 debug overlay.

    Text is TextMesh Pro; every string comes from <xref href="TDMaker.Unity.View.TDGameSettings.Texts" data-throw-if-not-resolved="false"></xref>
    (keys in <xref href="TDMaker.Unity.Localization.HudTexts" data-throw-if-not-resolved="false"></xref>), and the

    HUD relabels itself when the language or a table changes.'
  example: []
  syntax:
    content: '[DefaultExecutionOrder(60)]

      [AddComponentMenu("2D Tower Defense Maker/Game HUD")]

      public sealed class GameHud : MonoBehaviour'
    content.vb: '<DefaultExecutionOrder(60)>

      <AddComponentMenu("2D Tower Defense Maker/Game HUD")>

      Public NotInheritable Class GameHud Inherits MonoBehaviour'
