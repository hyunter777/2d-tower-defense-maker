  name: SimProfilerMarkers
  nameWithType: SimProfilerMarkers
  fullName: TDMaker.Unity.View.SimProfilerMarkers
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.View
  summary: 'Core profiling hook that wraps every fixed step and every pipeline stage (system) in a Unity

    <xref href="Unity.Profiling.ProfilerMarker" data-throw-if-not-resolved="false"></xref>, so the Unity Profiler shows <code>TDMaker.Sim.Step</code>
    with one child marker per stage

    (<code>TDMaker.Sim.Motion</code>, <code>TDMaker.Sim.Ranged</code>, ...). Another <xref href="TDMaker.Core.ISimProfiler"
    data-throw-if-not-resolved="false"></xref> can be chained through

    <xref href="TDMaker.Unity.View.SimProfilerMarkers.Next" data-throw-if-not-resolved="false"></xref>; it receives every
    callback after the marker begins and before it ends.'
  remarks: 'Installed by <xref href="TDMaker.Unity.View.SimulationRunner" data-throw-if-not-resolved="false"></xref> in builds
    with the profiler enabled (editor and development players).

    Marker Begin/End compile away in non-development players. Allocates only the first time a new system index is seen.

    Built-in stages are named after <xref href="TDMaker.Core.SimStage" data-throw-if-not-resolved="false"></xref>; registered
    custom systems are named

    <code>TDMaker.Sim.&lt;anchor stage&gt;#&lt;pipeline index&gt;</code>.'
  example: []
  syntax:
    content: 'public sealed class SimProfilerMarkers : ISimProfiler'
    content.vb: Public NotInheritable Class SimProfilerMarkers Implements ISimProfiler
  inheritance:
