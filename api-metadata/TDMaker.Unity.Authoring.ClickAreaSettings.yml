  summary: 'Per-content override of the HUD''s click target: an axis-aligned world rectangle around the entity position (the

    interior is clickable, the border is not) and a priority added to the kind''s default (heroes 1, everything else 0).

    When several targets contain the click, the higher priority wins, then the lower world reference point.'
