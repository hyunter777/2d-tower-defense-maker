  langs:
  - csharp
  - vb
  name: SimulationRunner
  nameWithType: SimulationRunner
  fullName: TDMaker.Unity.View.SimulationRunner
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.View
  summary: 'Owns a <xref href="TDMaker.Unity.View.SimulationRunner.Simulation" data-throw-if-not-resolved="false"></xref>
    and advances it with the core <xref href="TDMaker.Core.SimulationClock" data-throw-if-not-resolved="false"></xref> from
    <code>Update</code>

    (catch-up limit = <code>catch-up ticks × speed</code> per frame). Events produced during a frame are dispatched in emission

    order through <xref href="TDMaker.Unity.View.SimulationRunner.EventRaised" data-throw-if-not-resolved="false"></xref>
    and then cleared, so the event buffer (<code>Event Capacity</code>) must hold every

    tick a frame catches up (at most catch-up ticks × speed). Commands queued after the game ended are rejected by the core

    with <xref href="TDMaker.Core.CommandFailure.GameEnded" data-throw-if-not-resolved="false"></xref> on the next frame (the
    clock no longer steps, so the runner flushes them).'
  example: []
  syntax:
    content: '[DefaultExecutionOrder(-100)]

      [AddComponentMenu("2D Tower Defense Maker/Simulation Runner")]

      public sealed class SimulationRunner : MonoBehaviour'
    content.vb: '<DefaultExecutionOrder(-100)>

      <AddComponentMenu("2D Tower Defense Maker/Simulation Runner")>

      Public NotInheritable Class SimulationRunner Inherits MonoBehaviour'
