  id: SampleCurve(System.Collections.Generic.IReadOnlyList{UnityEngine.Vector2},System.Single,System.Collections.Generic.List{UnityEngine.Vector2},System.Collections.Generic.List{System.Int32},System.Collections.Generic.List{System.Single})
  parent: TDMaker.Unity.Authoring.PathGeometry
  langs:
  - csharp
  - vb
  name: SampleCurve(IReadOnlyList<Vector2>, float, List<Vector2>, List<int>, List<float>)
  nameWithType: PathGeometry.SampleCurve(IReadOnlyList<Vector2>, float, List<Vector2>, List<int>, List<float>)
  fullName: TDMaker.Unity.Authoring.PathGeometry.SampleCurve(System.Collections.Generic.IReadOnlyList<UnityEngine.Vector2>,
    float, System.Collections.Generic.List<UnityEngine.Vector2>, System.Collections.Generic.List<int>, System.Collections.Generic.List<float>)
  type: Method
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'Samples a smooth centripetal Catmull-Rom curve through <code class="paramref">controls</code> into nodes about

    <code class="paramref">nodeSpacing</code> apart (measured along the curve). Every control point is emitted exactly as
    a node,

    so the curve passes through them; each span gets <code>max(1, round(length / spacing))</code> equal arc-length steps.'
  example: []
  syntax:
    content: public static void SampleCurve(IReadOnlyList<Vector2> controls, float nodeSpacing, List<Vector2> output, List<int>
      controlNodes = null, List<float> spanFractions = null)
    parameters:
    - id: controls
      type: System.Collections.Generic.IReadOnlyList{UnityEngine.Vector2}
      description: Control points, from entry to exit.
    - id: nodeSpacing
      type: System.Single
      description: Target distance between nodes.
    - id: output
      type: System.Collections.Generic.List{UnityEngine.Vector2}
      description: Receives the nodes (cleared first).
    - id: controlNodes
      type: System.Collections.Generic.List{System.Int32}
      description: 'Optional: receives the node index of each control point.'
    - id: spanFractions
      type: System.Collections.Generic.List{System.Single}
      description: 'Optional: receives, per node, its span index plus the arc-length fraction within the span.'
    content.vb: Public Shared Sub SampleCurve(controls As IReadOnlyList(Of Vector2), nodeSpacing As Single, output As List(Of
      Vector2), controlNodes As List(Of Integer) = Nothing, spanFractions As List(Of Single) = Nothing)
  overload: TDMaker.Unity.Authoring.PathGeometry.SampleCurve*
  nameWithType.vb: PathGeometry.SampleCurve(IReadOnlyList(Of Vector2), Single, List(Of Vector2), List(Of Integer), List(Of
    Single))
  fullName.vb: TDMaker.Unity.Authoring.PathGeometry.SampleCurve(System.Collections.Generic.IReadOnlyList(Of UnityEngine.Vector2),
    Single, System.Collections.Generic.List(Of UnityEngine.Vector2), System.Collections.Generic.List(Of Integer), System.Collections.Generic.List(Of
    Single))
  name.vb: SampleCurve(IReadOnlyList(Of Vector2), Single, List(Of Vector2), List(Of Integer), List(Of Single))
