  name: UnitSandboxPlay
  nameWithType: UnitSandboxPlay
  fullName: TDMaker.Editor.UnitSandboxPlay
  type: Class
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Play-mode sandbox of the Unit Workshop: opens a new unsaved scene (camera, runner, views, debug HUD), enters Play
    mode, then

    rebuilds the sandbox level in play mode (so nothing depends on objects surviving the domain reload), builds every tower
    and

    calls the wave. Nothing is written to disk. When Play mode stops, the scenes that were open before (saved scenes only)
    are

    opened again.'
  example: []
  syntax:
    content: '[InitializeOnLoad]

      public static class UnitSandboxPlay'
    content.vb: '<InitializeOnLoad>

      Public Module UnitSandboxPlay'
