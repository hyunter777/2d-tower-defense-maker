  name: SampleScreenshot
  nameWithType: SampleScreenshot
  fullName: TDMaker.Editor.SampleScreenshot
  type: Class
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Plays the sample scene with a scripted run (build on every slot, upgrade, call waves early) and renders the main

    camera, HUD included, to a PNG (for store-page drafts). Works from the menu and from batch mode

    (<code>-batchmode -executeMethod TDMaker.Editor.SampleScreenshot.Capture</code>, without <code>-quit</code>: the editor
    exits

    by itself). Needs a graphics device, so it does nothing under <code>-nographics</code>.

    Options: <code>-tdmSeconds N</code> (game seconds, default 50), <code>-tdmWidth</code>/<code>-tdmHeight</code> (default
    1920x1080),

    <code>-tdmOut folder</code> (default <code>.work/screenshots</code>), <code>-tdmScene path</code> (default the Basic sample
    scene),

    <code>-tdmName file</code> (PNG name without extension), <code>-tdmGold N</code> (starting gold, default 4000), <code>-tdmUpgradeEvery
    S</code>

    (game seconds between scripted upgrades, default 1.5), <code>-tdmCallEvery S</code> (game seconds between early wave calls,
    default 8)

    <code>-tdmSlots N</code> (build on the first N pads only, default all), <code>-tdmNoHud</code> (map only, for key art)
    and <code>-tdmShot mode</code>:

    <code>beam</code> (default: waits for a channelled beam or chain lightning), <code>barracks</code> (waits for soldiers
    blocking

    several enemies), <code>hero</code> (sends the hero to the fight and casts every ready spell just before the shot) or

    <code>worldmap</code> (alias <code>levelselect</code>: the demo scene''s world map with preview progress in a throw-away
    slot; use with the demo scene)

    or <code>title</code> (the title and its language buttons), or <code>slots</code> (the demo scene''s save slot page over
    the same throw-away store) or <code>shop</code> (the world map''s star-upgrade shop

    over the same throw-away slot, with a few ranks bought and one rank''s tooltip shown). <code>-tdmMenu build</code> opens
    the build menu on the first

    pad left empty by <code>-tdmSlots</code> instead of a tower panel; <code>-tdmHidePause</code> keeps the frozen capture
    from showing the paused state.

    <code>-tdmDemoLevel N</code> starts battle N of the demo scene through its flow (instead of driving the scene''s own runner);

    <code>-tdmPanel</code> opens a tower panel in every shot mode (normally only the beam mode shows one). <code>-tdmLang
    code</code> (for example

    <code>ko</code>) shows the HUD and menus in that language of the scene''s text tables (not saved to PlayerPrefs). Demo-scene
    modes

    <code>levelinfo</code> (the world map with a level''s info panel open) and <code>controls</code> (the How to Play page);

    <code>-tdmPauseMenu</code> opens the pause menu in battle shots.

    Script errors logged during the run are counted and reported, so the batch run doubles as a play-mode smoke test.'
