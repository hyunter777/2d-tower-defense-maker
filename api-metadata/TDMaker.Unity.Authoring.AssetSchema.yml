  name: AssetSchema
  nameWithType: AssetSchema
  fullName: TDMaker.Unity.Authoring.AssetSchema
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: Schema versions and ordered migration steps for authored assets, so that data saved by an older release opens without
    silent loss.
  remarks: '<p><b>Version rule.</b> Each versioned asset serializes an <code>int</code> with no initializer. Unity keeps the
    C# initializer when a

    field is missing from an old file, so a 1.0 file reads 0. A brand-new asset (<code>ScriptableObject.CreateInstance</code>,
    a Create menu,

    New Level, Unit Workshop) is never deserialized before its first serialization; <xref href="TDMaker.Unity.Authoring.AssetSchema.HandleBeforeSerialize(TDMaker.Unity.Authoring.IVersionedAsset)"
    data-throw-if-not-resolved="false"></xref> stamps such an

    asset with the current version, so it is saved as current without any change to the creation code. <xref href="TDMaker.Unity.Authoring.AssetSchema.MarkCurrent(TDMaker.Unity.Authoring.IVersionedAsset)"
    data-throw-if-not-resolved="false"></xref> stamps

    explicitly. Because 0 can also mean "made in code and never stamped", <b>every step must be idempotent</b>: running it
    on data that is

    already in the new shape must change nothing.</p>

    <p><b>Steps.</b> A step registered at <code>fromVersion</code> brings data from that version to <code>fromVersion + 1</code>.
    A type''s current

    version is one past its highest registered step, and at least <xref href="TDMaker.Unity.Authoring.AssetSchema.BaselineVersion"
    data-throw-if-not-resolved="false"></xref>. Steps registered for a base type also run

    for its subclasses (base first). Register from the asset type''s static constructor; the framework runs the static constructors
    of the

    whole type hierarchy before it reads the registry.</p>

    <p><b>On load.</b> <xref href="TDMaker.Unity.Authoring.AssetSchema.HandleAfterDeserialize(TDMaker.Unity.Authoring.IVersionedAsset)"
    data-throw-if-not-resolved="false"></xref> runs the missing steps in memory, in order, but does not change the stored

    version: the file on disk is still old until it is upgraded and saved (<xref href="TDMaker.Unity.Authoring.AssetSchema.NeedsUpgrade(UnityEngine.Object)"
    data-throw-if-not-resolved="false"></xref>, <xref href="TDMaker.Unity.Authoring.AssetSchema.Upgrade(UnityEngine.Object)"
    data-throw-if-not-resolved="false"></xref>). Steps run

    inside <code>OnAfterDeserialize</code>, possibly off the main thread, so they must only touch the asset''s serialized
    fields: no Unity API

    (no <code>name</code>, no <code>AssetDatabase</code>, no <code>Object == null</code> on other objects). A migration that
    needs Unity API belongs in the

    asset''s <code>OnEnable</code> or in an editor upgrade pass instead.</p>

    <p><b>Newer data.</b> An asset whose version is greater than the code''s current version is refused: no step runs, the
    version is

    never lowered, and <xref href="TDMaker.Unity.Authoring.AssetSchema.IsNewerThanSupported(UnityEngine.Object)" data-throw-if-not-resolved="false"></xref>
    reports it.</p>

    <p><b>Renaming fields (<code>FormerlySerializedAs</code> policy).</b> A renamed serialized field must keep

    <code>[UnityEngine.Serialization.FormerlySerializedAs("oldName")]</code> for as long as older data may exist; never remove
    it. A rename alone

    needs no step. When the <i>meaning</i> of data changes (units, ranges, a field split or merged, a value moved elsewhere),
    keep the old

    field readable (hidden), and add a step that converts it and clears it, as the level''s legacy star rule does.</p>'
  example: []
  syntax:
    content: public static class AssetSchema
    content.vb: Public Module AssetSchema
