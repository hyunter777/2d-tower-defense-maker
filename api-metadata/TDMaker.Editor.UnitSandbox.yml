  summary: 'The Unit Workshop''s test range: a straight lane with the chosen towers beside it, and a wave of the unit under
    test (or, for

    heroes and soldiers, a wave of an opponent enemy against them). <xref href="TDMaker.Editor.UnitSandbox.Run(TDMaker.Editor.UnitSandbox.Setup)"
    data-throw-if-not-resolved="false"></xref> plays it headless and deterministically

