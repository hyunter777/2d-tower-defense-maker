- uid: TDMaker.Unity.Localization.ITextProvider.TryGetText(System.String,System.String@)
  commentId: M:TDMaker.Unity.Localization.ITextProvider.TryGetText(System.String,System.String@)
  id: TryGetText(System.String,System.String@)
  parent: TDMaker.Unity.Localization.ITextProvider
  langs:
  - csharp
  - vb
  name: TryGetText(string, out string)
  nameWithType: ITextProvider.TryGetText(string, out string)
  fullName: TDMaker.Unity.Localization.ITextProvider.TryGetText(string, out string)
  type: Method
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Localization
  summary: 'Looks up <code class="paramref">key</code>. Returns false (or an empty text) when the provider has no text for
    it, so the resolver

    falls back to the English text and then to the key itself. Texts may contain rich-text tags and

    <xref href="System.String.Format(System.String%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> placeholders
    (<code>{0}</code>, <code>{1}</code>) where the key expects numbers or names.'
  example: []
  syntax:
    content: bool TryGetText(string key, out string text)
    parameters:
    - id: key
      type: System.String
    - id: text
      type: System.String
    return:
      type: System.Boolean
    content.vb: Function TryGetText(key As String, text As String) As Boolean
