- uid: TDMaker.Unity.Campaign.CampaignProgress.RecordResult(System.String,System.Boolean,System.Int32)
  commentId: M:TDMaker.Unity.Campaign.CampaignProgress.RecordResult(System.String,System.Boolean,System.Int32)
  id: RecordResult(System.String,System.Boolean,System.Int32)
  parent: TDMaker.Unity.Campaign.CampaignProgress
  langs:
  - csharp
  - vb
  name: RecordResult(string, bool, int)
  nameWithType: CampaignProgress.RecordResult(string, bool, int)
  fullName: TDMaker.Unity.Campaign.CampaignProgress.RecordResult(string, bool, int)
  type: Method
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Campaign
  summary: 'Records the outcome of a battle on <code class="paramref">key</code>. A victory becomes a pending clear (several
    victories keep the best

    rating); a defeat changes nothing. The map merges pending clears with <xref href="TDMaker.Unity.Campaign.CampaignProgress.ApplyPending"
    data-throw-if-not-resolved="false"></xref>. Save the slot afterwards.

    Returns false for unknown keys and defeats.'
  example: []
  syntax:
    content: public bool RecordResult(string key, bool won, int stars)
    parameters:
    - id: key
      type: System.String
    - id: won
      type: System.Boolean
    - id: stars
      type: System.Int32
    return:
      type: System.Boolean
    content.vb: Public Function RecordResult(key As String, won As Boolean, stars As Integer) As Boolean
  overload: TDMaker.Unity.Campaign.CampaignProgress.RecordResult*
