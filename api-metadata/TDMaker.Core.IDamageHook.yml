  summary: Damage hooks run in registration order. Implementations must not allocate or recursively request damage in BeforeDamage.
  example:
  - <pre><code class="lang-csharp">public void BeforeDamage(Simulation sim, ref DamageContext hit) { hit.Amount *= 0.8f; }</code></pre>
