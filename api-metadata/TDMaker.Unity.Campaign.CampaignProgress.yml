  name: CampaignProgress
  nameWithType: CampaignProgress
  fullName: TDMaker.Unity.Campaign.CampaignProgress
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Campaign
  summary: 'Campaign rules over one save slot''s <xref href="TDMaker.Unity.Campaign.ProfileData" data-throw-if-not-resolved="false"></xref>.
    A level is locked until its record exists; records are created

    when the unlock rule holds (<xref href="TDMaker.Unity.Campaign.CampaignProgress.Refresh" data-throw-if-not-resolved="false"></xref>),
    and an opened level never locks again. A victory is first recorded as a

    pending clear (<xref href="TDMaker.Unity.Campaign.CampaignProgress.RecordVictory(System.String%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>,
    at the end of the battle) and merged into the map once by

    <xref href="TDMaker.Unity.Campaign.CampaignProgress.ApplyPending" data-throw-if-not-resolved="false"></xref> (on map entry):
    best stars keep the maximum, re-wins never grant stars twice, the first win raises

    <xref href="TDMaker.Unity.Campaign.CampaignProgress.FirstCleared" data-throw-if-not-resolved="false"></xref>, and the
    next levels open. Several victories before a merge keep the best rating, and a later

    defeat does not discard it. Earned stars = sum of best stars of the levels that count; available = earned − spent.'
  example: []
  syntax:
    content: public sealed class CampaignProgress
    content.vb: Public NotInheritable Class CampaignProgress
