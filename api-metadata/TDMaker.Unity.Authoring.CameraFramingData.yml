  name: OrthographicSize(Rect, float, bool)
  nameWithType: CameraFramingData.OrthographicSize(Rect, float, bool)
  fullName: TDMaker.Unity.Authoring.CameraFramingData.OrthographicSize(UnityEngine.Rect, float, bool)
  type: Method
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'Orthographic size (half the view height) for this framing: <code class="paramref">bounds</code> are the camera
    bounds,

    <code class="paramref">aspect</code> the screen aspect, and <code class="paramref">cover</code> caps the view inside the
    bounds (fixed map

    rectangles) instead of fitting the bounds whole.'
  example: []
  syntax:
    content: public float OrthographicSize(Rect bounds, float aspect, bool cover)
    parameters:
    - id: bounds
      type: UnityEngine.Rect
    - id: aspect
      type: System.Single
    - id: cover
      type: System.Boolean
    return:
      type: System.Single
    content.vb: Public Function OrthographicSize(bounds As Rect, aspect As Single, cover As Boolean) As Single
