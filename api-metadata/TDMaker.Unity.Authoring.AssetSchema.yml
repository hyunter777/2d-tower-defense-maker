  type: Method
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'Runs every missing step on <code class="paramref">asset</code> and stamps it with the current version(s). Does
    nothing for current, unversioned

    or newer assets. The caller marks the asset dirty and saves it (this runtime class never touches the AssetDatabase).'
  example: []
  syntax:
    content: public static bool Upgrade(Object asset)
    parameters:
    - id: asset
      type: UnityEngine.Object
    return:
      type: System.Boolean
      description: True when the stored version changed, so the asset must be saved.
    content.vb: Public Shared Function Upgrade(asset As [Object]) As Boolean
  overload: TDMaker.Unity.Authoring.AssetSchema.Upgrade*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: A step failed; the asset keeps its old version.
