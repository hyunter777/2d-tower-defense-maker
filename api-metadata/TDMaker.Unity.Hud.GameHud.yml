  summary: 'The corner for the tower panel that covers the least of the fight: never the selected tower (<code class="paramref">tower</code>),

    then as few units (<code class="paramref">units</code>, canvas positions) as possible; ties go to the side away from the
    tower, then

    to the top. <code class="paramref">current</code> (or -1) is kept unless another corner covers at least two units fewer,
    so the panel

    does not jump around while the fight moves.'
