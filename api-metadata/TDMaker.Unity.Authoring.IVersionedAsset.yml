  fullName: TDMaker.Unity.Authoring.IVersionedAsset.SchemaVersion
  type: Property
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'Schema version of the serialized data. 0 means "written before versioning" (1.0 data) or "made in code and not
    yet stamped";

    do not edit it by hand.'
  example: []
  syntax:
    content: int SchemaVersion { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Property SchemaVersion As Integer
