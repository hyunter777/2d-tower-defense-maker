- uid: TDMaker.Unity.Authoring.AssetSchema.RegisterStep``1(System.Int32,System.Action{``0})
  commentId: M:TDMaker.Unity.Authoring.AssetSchema.RegisterStep``1(System.Int32,System.Action{``0})
  id: RegisterStep``1(System.Int32,System.Action{``0})
  parent: TDMaker.Unity.Authoring.AssetSchema
  langs:
