- uid: TDMaker.Unity.Campaign.CampaignProgress.ApplyPending
  commentId: M:TDMaker.Unity.Campaign.CampaignProgress.ApplyPending
  id: ApplyPending
  parent: TDMaker.Unity.Campaign.CampaignProgress
  langs:
  - csharp
  - vb
  name: ApplyPending()
  nameWithType: CampaignProgress.ApplyPending()
  fullName: TDMaker.Unity.Campaign.CampaignProgress.ApplyPending()
  type: Method
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Campaign
  summary: 'Merges the pending victories into the map once and clears them: best stars keep the maximum, the first win completes
    the

    level (and raises <xref href="TDMaker.Unity.Campaign.CampaignProgress.FirstCleared" data-throw-if-not-resolved="false"></xref>),
    then every level whose rule now holds opens. Pending clears of unknown or

    still locked levels are dropped. Calling it again without new victories changes nothing. Save the slot afterwards.'
  example: []
  syntax:
    content: public CampaignMapUpdate ApplyPending()
    return:
      type: TDMaker.Unity.Campaign.CampaignMapUpdate
    content.vb: Public Function ApplyPending() As CampaignMapUpdate
  overload: TDMaker.Unity.Campaign.CampaignProgress.ApplyPending*
