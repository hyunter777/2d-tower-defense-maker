  summary: 'Keys of every text the <xref href="TDMaker.Unity.Hud.GameHud" data-throw-if-not-resolved="false"></xref> and the
    campaign screens show, and their built-in English texts (used when no table

    has a key). <code>{0}</code>, <code>{1}</code> ... are filled with numbers or names; keep them (in any order) when translating.

    The sample generator writes these texts into the English sample table, so a copy of that asset is a ready template.'
