  namespace: TDMaker.Unity.Authoring
  summary: 'Where blockers stand around this enemy (the engagement host). Blockers stand on the side the enemy is walking

    toward, <code>host X + guest X</code> world units away horizontally, shifted by the summed Y values. The second and third

    blocker take rows at −/+ <xref href="TDMaker.Unity.Authoring.EngagementHostData.rowSpacing" data-throw-if-not-resolved="false"></xref>
    on Y (pulled back by half of it on X); later blockers repeat the

    three places. Independent of melee range. Typical X: half the enemy''s drawn body width plus a small gap.'
  example: []
  syntax:
    content: public sealed class EngagementHostData
    content.vb: Public NotInheritable Class EngagementHostData
