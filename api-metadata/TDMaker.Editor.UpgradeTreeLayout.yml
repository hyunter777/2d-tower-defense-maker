  type: Method
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Wheel delta to a pan step. Shift turns a vertical wheel into a horizontal pan; a delta that is already horizontal
    (the

    editor converts Shift+wheel itself on some platforms, and tilt wheels/trackpads send x) is kept as it is.'
  example: []
