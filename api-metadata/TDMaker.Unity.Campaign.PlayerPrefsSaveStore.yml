  summary: 'Store in <xref href="UnityEngine.PlayerPrefs" data-throw-if-not-resolved="false"></xref> (browser storage in WebGL
    builds): one string per slot under <code>prefix + slot number</code>.

    Unreadable content is copied to <code>key.bak</code> before the slot is cleared. Flushes with <xref href="UnityEngine.PlayerPrefs.Save"
    data-throw-if-not-resolved="false"></xref> on every write.'
  example: []
  syntax:
