  summary: 'Assigns the optional sample audio (<code>Assets/TDMaker/Samples/Audio/Sfx/&lt;key&gt;.ogg</code> and <code>Music/&lt;key&gt;.ogg</code>)

    to sample cues by key. A missing file leaves its cue empty, so sample generation is deterministic with or without the
    audio.

    The key tables are public so tests (and buyers copying the scheme) can check them.'
