  namespace: TDMaker.Editor
  summary: 'Fills the level''s sound cues, music and the scene''s interface sounds with the optional sample audio

    (<code>Assets/TDMaker/Samples/Audio</code>). Off: every cue and track stays empty, so the level does not depend on the
    Samples folder

    (fresh starter assets then reference nothing in it). Defaults to off.'
