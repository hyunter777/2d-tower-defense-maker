- uid: TDMaker.Editor.UpgradeTreeLayout.ClampPan(UnityEngine.Vector2,UnityEngine.Rect,UnityEngine.Vector2)
  commentId: M:TDMaker.Editor.UpgradeTreeLayout.ClampPan(UnityEngine.Vector2,UnityEngine.Rect,UnityEngine.Vector2)
  id: ClampPan(UnityEngine.Vector2,UnityEngine.Rect,UnityEngine.Vector2)
  parent: TDMaker.Editor.UpgradeTreeLayout
  langs:
  - csharp
  - vb
  name: ClampPan(Vector2, Rect, Vector2)
  nameWithType: UpgradeTreeLayout.ClampPan(Vector2, Rect, Vector2)
  fullName: TDMaker.Editor.UpgradeTreeLayout.ClampPan(UnityEngine.Vector2, UnityEngine.Rect, UnityEngine.Vector2)
  type: Method
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Clamps a canvas pan (the content point shown at the view''s top-left) to the content bounds expanded by the view
    size, so

    the canvas pans freely even when the tree is smaller than the window, while at least <xref href="TDMaker.Editor.UpgradeTreeLayout.PanKeepVisible"
    data-throw-if-not-resolved="false"></xref> pixels

    of <code class="paramref">content</code> (the cards) always stay visible on each axis.'
  example: []
  syntax:
    content: public static Vector2 ClampPan(Vector2 pan, Rect content, Vector2 view)
    parameters:
    - id: pan
      type: UnityEngine.Vector2
    - id: content
      type: UnityEngine.Rect
    - id: view
      type: UnityEngine.Vector2
    return:
      type: UnityEngine.Vector2
    content.vb: Public Shared Function ClampPan(pan As Vector2, content As Rect, view As Vector2) As Vector2
  overload: TDMaker.Editor.UpgradeTreeLayout.ClampPan*
