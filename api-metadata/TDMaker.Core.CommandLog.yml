  name: CommandLog
  nameWithType: CommandLog
  fullName: TDMaker.Core.CommandLog
  type: Class
  assemblies:
  - TDMaker.Core
  namespace: TDMaker.Core
  summary: Fixed-capacity input recording with seed and versioned binary persistence. Record only external Enqueue calls between
    ticks.
  remarks: "Recreate identical templates, initial spawns and extensions before replay. Commands generated inside Step are
    regenerated by their systems.\n            Saving and loading allocate outside Step; custom commands require an ICommandCodec."
  example:
  - <pre><code class="lang-csharp">var log = new CommandLog(sim.Seed); sim.StartRecording(log); /* enqueue and step */ sim.StopRecording();
    log.WriteTo(stream);</code></pre>
