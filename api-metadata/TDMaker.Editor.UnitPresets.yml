  fullName: TDMaker.Editor.UnitPresets.Apply(TDMaker.Unity.Authoring.EntityAssetBase, TDMaker.Editor.UnitPreset, TDMaker.Editor.UnitPresets.Baseline,
    TDMaker.Unity.Authoring.EnemyAsset)
  type: Method
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Fills <code class="paramref">asset</code> (an enemy, hero or soldier matching <xref href="TDMaker.Editor.UnitPresets.AssetType(TDMaker.Editor.UnitPreset)"
    data-throw-if-not-resolved="false"></xref>) from the preset. A splitter

    also needs its smaller enemy: pass it as <code class="paramref">companion</code> (it is filled too), otherwise the split
    stays empty.'
