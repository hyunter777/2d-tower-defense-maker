  namespace: TDMaker.Editor
  summary: 'Fills enemy, hero and soldier assets from ratios to a baseline (the project''s median enemy and soldier, or built-in

    defaults). The ratios stay inside the bands of the balance notes: bounty density ×0.5–1.8 of the baseline, defenses in
    the

    low (0–0.2), medium (0.2–0.5) and strong (0.5–0.7) bands, hero experience steps ×1.1–1.6 after a first jump of ×2.5–3.5.

    They are a starting point; tune the result against your own towers.'
  example: []
  syntax:
    content: public static class UnitPresets
    content.vb: Public Module UnitPresets
