  name: HudTheme
  nameWithType: HudTheme
  fullName: TDMaker.Unity.Hud.HudTheme
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Hud
  summary: 'Look of the production HUD and of the world-space feedback (ranges, rally, aim). Every sprite slot is optional:

    empty slots use generated sprites from <xref href="TDMaker.Unity.Hud.HudSprites" data-throw-if-not-resolved="false"></xref>.
    Create one with

    <code>Assets/Create/2D Tower Defense Maker/HUD Theme</code> and assign it to <xref href="TDMaker.Unity.Hud.GameHud" data-throw-if-not-resolved="false"></xref>.'
  example: []
  syntax:
    content: '[CreateAssetMenu(menuName = "2D Tower Defense Maker/HUD Theme", fileName = "HudTheme", order = 40)]

      public sealed class HudTheme : ScriptableObject'
    content.vb: '<CreateAssetMenu(menuName:="2D Tower Defense Maker/HUD Theme", fileName:="HudTheme", order:=40)>

      Public NotInheritable Class HudTheme Inherits ScriptableObject'
