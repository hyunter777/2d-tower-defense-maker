  name: UpgradeShopAsset
  nameWithType: UpgradeShopAsset
  fullName: TDMaker.Unity.Campaign.UpgradeShopAsset
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Campaign
  summary: 'The permanent star-upgrade shop of a campaign: ordered tracks (columns) of ranks bought in order with earned stars.
    Purchases

    live in the save slot (<xref href="TDMaker.Unity.Campaign.CampaignProgress.GetUpgradeRank(System.String)" data-throw-if-not-resolved="false"></xref>
    by track key); a battle bakes the shop and the purchased

    ranks into a core <xref href="TDMaker.Core.Defs.UpgradeSnapshot" data-throw-if-not-resolved="false"></xref> (<xref href="TDMaker.Unity.Campaign.UpgradeShopAsset.CreateSnapshot(System.Func%7bSystem.String%2cSystem.Int32%7d%2cSystem.Nullable%7bSystem.Int32%7d)"
    data-throw-if-not-resolved="false"></xref>) that the simulation

    applies before anything spawns. Assign it to <xref href="TDMaker.Unity.Campaign.CampaignAsset.upgradeShop" data-throw-if-not-resolved="false"></xref>
    (the world map then shows a Shop button

    and every battle started while that campaign''s slot is open applies it) or to a <code>SimulationRunner</code> directly.

    Edit it in <b>Tools &gt; 2D Tower Defense Maker &gt; Upgrade Shop</b>.'
