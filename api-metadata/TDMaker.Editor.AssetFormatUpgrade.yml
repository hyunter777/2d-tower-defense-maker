- uid: TDMaker.Editor.AssetFormatUpgrade
  commentId: T:TDMaker.Editor.AssetFormatUpgrade
  id: AssetFormatUpgrade
  parent: TDMaker.Editor
  children:
  - TDMaker.Editor.AssetFormatUpgrade.CountOutdated(System.Int32@)
  - TDMaker.Editor.AssetFormatUpgrade.RunBatch
  - TDMaker.Editor.AssetFormatUpgrade.UpgradeAll
  langs:
  - csharp
  - vb
  name: AssetFormatUpgrade
  nameWithType: AssetFormatUpgrade
  fullName: TDMaker.Editor.AssetFormatUpgrade
  type: Class
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Finds maker assets (<xref href="TDMaker.Unity.Authoring.IVersionedAsset" data-throw-if-not-resolved="false"></xref>)
    written in an older data format and re-saves them in the current one,

    using the steps registered with <xref href="TDMaker.Unity.Authoring.AssetSchema" data-throw-if-not-resolved="false"></xref>.
    Assets saved by a newer package are never touched.

    The upgrade is a re-save and is not undoable; commit or back up the project first.'
  example: []
  syntax:
    content: public static class AssetFormatUpgrade
    content.vb: Public Module AssetFormatUpgrade
  inheritance:
