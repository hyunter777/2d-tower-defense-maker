  langs:
  - csharp
  - vb
  name: Reduction(DamageKind, float, float, float)
  nameWithType: CombatMath.Reduction(DamageKind, float, float, float)
  fullName: TDMaker.Editor.CombatMath.Reduction(TDMaker.Core.Defs.DamageKind, float, float, float)
  type: Method
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Fraction removed from a hit of <code class="paramref">kind</code> when the target''s matching defense is <code
    class="paramref">defense</code>.

    For physical-derived kinds the defense is physical armor; for magical it is magic resistance; for poison, poison resistance.'
  example: []
  syntax:
    content: public static float Reduction(DamageKind kind, float defense, float physicalPierce = 0, float magicalPierce =
      0)
    parameters:
    - id: kind
      type: TDMaker.Core.Defs.DamageKind
    - id: defense
      type: System.Single
    - id: physicalPierce
      type: System.Single
    - id: magicalPierce
      type: System.Single
    return:
      type: System.Single
    content.vb: Public Shared Function Reduction(kind As DamageKind, defense As Single, physicalPierce As Single = 0, magicalPierce
      As Single = 0) As Single
  overload: TDMaker.Editor.CombatMath.Reduction*
  nameWithType.vb: CombatMath.Reduction(DamageKind, Single, Single, Single)
  fullName.vb: TDMaker.Editor.CombatMath.Reduction(TDMaker.Core.Defs.DamageKind, Single, Single, Single)
  name.vb: Reduction(DamageKind, Single, Single, Single)
