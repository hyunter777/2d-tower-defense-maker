- uid: TDMaker.Unity.Campaign.UpgradeEffectData.operation
  commentId: F:TDMaker.Unity.Campaign.UpgradeEffectData.operation
  id: operation
  parent: TDMaker.Unity.Campaign.UpgradeEffectData
  langs:
  - csharp
  - vb
  name: operation
  nameWithType: UpgradeEffectData.operation
  fullName: TDMaker.Unity.Campaign.UpgradeEffectData.operation
  type: Field
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Campaign
  summary: Arithmetic (Stat only). Each effect is applied on its own, in order; rounding happens per effect.
  example: []
  syntax:
    content: '[Tooltip("Multiply Ceil rounds up right after multiplying (use it for damage and health). Multiply keeps fractions
      (ranges, cooldowns). Add / Subtract / Set change the current value. Effects apply one after another, in order.")]

      public UpgradeOperation operation'
    return:
      type: TDMaker.Core.Defs.UpgradeOperation
    content.vb: '<Tooltip("Multiply Ceil rounds up right after multiplying (use it for damage and health). Multiply keeps
      fractions (ranges, cooldowns). Add / Subtract / Set change the current value. Effects apply one after another, in order.")>

      Public operation As UpgradeOperation'
  attributes:
  - type: UnityEngine.TooltipAttribute
    ctor: UnityEngine.TooltipAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Multiply Ceil rounds up right after multiplying (use it for damage and health). Multiply keeps fractions (ranges,
        cooldowns). Add / Subtract / Set change the current value. Effects apply one after another, in order.
