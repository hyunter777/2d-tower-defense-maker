- uid: TDMaker.Unity.Authoring.LevelAsset.rangeYScale
  commentId: F:TDMaker.Unity.Authoring.LevelAsset.rangeYScale
  id: rangeYScale
  parent: TDMaker.Unity.Authoring.LevelAsset
  langs:
  - csharp
  - vb
  name: rangeYScale
  nameWithType: LevelAsset.rangeYScale
  fullName: TDMaker.Unity.Authoring.LevelAsset.rangeYScale
  type: Field
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'Range ellipse Y scale k: ranges cover <code>dx²/r² + dy²/(k·r)² ≤ 1</code>, so the vertical semi-axis is <code>k·r</code>.

    Values below 1 flatten ranges vertically for an oblique top-down look (see <xref href="TDMaker.Unity.Authoring.RangeShape"
    data-throw-if-not-resolved="false"></xref>).'
  example: []
  syntax:
    content: '[Tooltip("Range ellipse Y scale k: vertical semi-axis = range × k. Below 1 flattens ranges (oblique view).")]

      [Min(0.01)]

      public float rangeYScale'
    return:
      type: System.Single
    content.vb: '<Tooltip("Range ellipse Y scale k: vertical semi-axis = range × k. Below 1 flattens ranges (oblique view).")>

      <Min(0.01)>

      Public rangeYScale As Single'
  attributes:
  - type: UnityEngine.TooltipAttribute
    ctor: UnityEngine.TooltipAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: 'Range ellipse Y scale k: vertical semi-axis = range × k. Below 1 flattens ranges (oblique view).'
  - type: UnityEngine.MinAttribute
    ctor: UnityEngine.MinAttribute.#ctor(System.Single)
    arguments:
    - type: System.Single
      value: 0.01
