  summary: 'Same-unit return on the spot, baked into a <xref href="TDMaker.Core.Defs.ReviveDef" data-throw-if-not-resolved="false"></xref>
    (template custom data): a killed unit lies down, then gets

    <xref href="TDMaker.Unity.Authoring.ReviveData.returnShare" data-throw-if-not-resolved="false"></xref> of its health back,
    rises and walks on with the same identity. Its bounty is paid once, on the first

    death. Pending returns hold victory.'
