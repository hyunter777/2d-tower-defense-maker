  nameWithType: HudTheme.font
  fullName: TDMaker.Unity.Hud.HudTheme.font
  type: Field
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Hud
  summary: 'TextMesh Pro font asset of the HUD, damage numbers and sample menus; empty uses the default font asset of the
    project''s

    TMP Settings (LiberationSans SDF after importing the TMP Essential Resources). For Chinese, Japanese or Korean add a

    dynamic CJK font asset to <xref href="TDMaker.Unity.Hud.HudTheme.fallbackFonts" data-throw-if-not-resolved="false"></xref>
    (see Documentation/Presentation.md).'
  example: []
  syntax:
    content: '[Header("Text")]

      [Tooltip("TextMesh Pro font asset. Empty = the default font asset from TMP Settings. Add CJK fonts to Fallback Fonts
      for Korean, Japanese or Chinese tables.")]

      public TMP_FontAsset font'
    return:
      type: TMPro.TMP_FontAsset
    content.vb: '<Header("Text")>

      <Tooltip("TextMesh Pro font asset. Empty = the default font asset from TMP Settings. Add CJK fonts to Fallback Fonts
      for Korean, Japanese or Chinese tables.")>

      Public font As TMP_FontAsset'
  attributes:
  - type: UnityEngine.HeaderAttribute
    ctor: UnityEngine.HeaderAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Text
  - type: UnityEngine.TooltipAttribute
    ctor: UnityEngine.TooltipAttribute.#ctor(System.String)
    arguments:
