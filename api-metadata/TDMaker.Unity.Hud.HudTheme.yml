- uid: TDMaker.Unity.Hud.HudTheme.fallbackFonts
  commentId: F:TDMaker.Unity.Hud.HudTheme.fallbackFonts
  id: fallbackFonts
  parent: TDMaker.Unity.Hud.HudTheme
  langs:
  - csharp
  - vb
  name: fallbackFonts
  nameWithType: HudTheme.fallbackFonts
  fullName: TDMaker.Unity.Hud.HudTheme.fallbackFonts
  type: Field
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Hud
  summary: 'Fonts tried in order for characters <xref href="TDMaker.Unity.Hud.HudTheme.font" data-throw-if-not-resolved="false"></xref>
    lacks – for example a dynamic Korean, Japanese or Chinese font asset –

    after the font''s own fallbacks and before the TMP Settings fallbacks. They are applied to a runtime copy of a static
    HUD font

    (such as the TMP default LiberationSans SDF), so neither that font asset nor the TMP Settings change. A dynamic HUD font

    ignores this list (one warning): give that font asset its own Fallback Font Assets instead.'
  example: []
  syntax:
    content: '[Tooltip("Fonts tried in order for characters the HUD font lacks (for example a dynamic CJK font asset). Applied
      to a runtime copy of a static HUD font; the font asset and the TMP Settings stay unchanged.")]

      public List<TMP_FontAsset> fallbackFonts'
    return:
      type: System.Collections.Generic.List{TMPro.TMP_FontAsset}
    content.vb: '<Tooltip("Fonts tried in order for characters the HUD font lacks (for example a dynamic CJK font asset).
      Applied to a runtime copy of a static HUD font; the font asset and the TMP Settings stay unchanged.")>

      Public fallbackFonts As List(Of TMP_FontAsset)'
  attributes:
  - type: UnityEngine.TooltipAttribute
    ctor: UnityEngine.TooltipAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Fonts tried in order for characters the HUD font lacks (for example a dynamic CJK font asset). Applied to a runtime
        copy of a static HUD font; the font asset and the TMP Settings stay unchanged.
