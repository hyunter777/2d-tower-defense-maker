    (successors), baked with

    <xref href="TDMaker.Core.Defs.SummonDef.WithDeathSuccession(System.Int32%2cSystem.Single%2cTDMaker.Core.Defs.SuccessorBountyPolicy%2cSystem.Boolean%2cSystem.Boolean)"
