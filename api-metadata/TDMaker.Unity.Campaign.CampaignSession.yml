  namespace: TDMaker.Unity.Campaign
  summary: 'The save slots whose slot is open right now (set by <xref href="TDMaker.Unity.Campaign.CampaignSaveSlots.Open(System.Int32)"
    data-throw-if-not-resolved="false"></xref>). A <code>SimulationRunner</code> reads the

    open slot''s purchased upgrade ranks and its campaign''s <xref href="TDMaker.Unity.Campaign.CampaignAsset.upgradeShop"
    data-throw-if-not-resolved="false"></xref> from here when a battle starts,

    and the upgrade shop saves through it, so a flow script needs no extra wiring. Cleared when play mode starts.'
