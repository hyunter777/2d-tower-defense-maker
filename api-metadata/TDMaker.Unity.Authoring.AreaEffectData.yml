- uid: TDMaker.Unity.Authoring.AreaEffectData.untilSourceLost
  commentId: F:TDMaker.Unity.Authoring.AreaEffectData.untilSourceLost
  id: untilSourceLost
  parent: TDMaker.Unity.Authoring.AreaEffectData
  langs:
  - csharp
  - vb
  name: untilSourceLost
  nameWithType: AreaEffectData.untilSourceLost
  fullName: TDMaker.Unity.Authoring.AreaEffectData.untilSourceLost
  type: Field
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'Permanent region: no timed expiry, it lasts while its source is alive and is removed (with the effects it attached)
    when the

    source dies or is removed. Meant for auras; emitting it without a living source (spell, impact) emits nothing.'
  example: []
  syntax:
    content: '[Tooltip("Permanent aura: lasts while the source lives, then removes itself and the effects it attached. Needs
      a living source (not for spells or impacts).")]

      public bool untilSourceLost'
    return:
      type: System.Boolean
    content.vb: '<Tooltip("Permanent aura: lasts while the source lives, then removes itself and the effects it attached.
      Needs a living source (not for spells or impacts).")>

      Public untilSourceLost As Boolean'
  attributes:
  - type: UnityEngine.TooltipAttribute
    ctor: UnityEngine.TooltipAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: 'Permanent aura: lasts while the source lives, then removes itself and the effects it attached. Needs a living
        source (not for spells or impacts).'
