  summary: 'Scans 2D Tower Defense Maker content in the project and open scenes: missing references, duplicate template ids,
    path and

    lane problems, waves referencing missing enemies or paths, upgrade cycles and unreachable upgrade tiers, level bake

    failures, missing TextMesh Pro Essential Resources, string table problems and campaign problems (missing levels, duplicate

    keys, unlock cycles, levels that can never open).'
