  name: MineFieldData
  nameWithType: MineFieldData
  fullName: TDMaker.Unity.Authoring.MineFieldData
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'Automatic mine laying, baked into a <xref href="TDMaker.Core.Defs.DeploymentPlanDef" data-throw-if-not-resolved="false"></xref>
    with a <xref href="TDMaker.Core.Defs.TrapDef" data-throw-if-not-resolved="false"></xref> payload. Each activation picks

    one lane node of a level path inside the distance band around the producer (seeded, deterministic), reserves it, throws
    the mine

    (flight, landing, then the arm delay) and leaves a trap that bursts under the first eligible unit. The lifetime counts
    from the

    throw. Use it as an ability action (<xref href="TDMaker.Unity.Authoring.AbilityActionData.useMines" data-throw-if-not-resolved="false"></xref>);
    it fails, without a fallback spot, when no node fits.'
  example: []
  syntax:
    content: public sealed class MineFieldData
    content.vb: Public NotInheritable Class MineFieldData
  inheritance:
  - System.Object
  inheritedMembers:
