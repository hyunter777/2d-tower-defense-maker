  fullName: TDMaker.Unity.Campaign.CampaignMapScreen
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Campaign
  summary: 'World map screen built from code (uGUI + TextMesh Pro, styled by a <xref href="TDMaker.Unity.Hud.HudTheme" data-throw-if-not-resolved="false"></xref>):
    the campaign''s map picture with a

    point per level (locked with a lock, open with its number, completed with its best stars), dashed roads from each level''s

    prerequisites, the star total, and a level info panel (title, summary, best stars, unlock requirements, Play). Call

    <xref href="TDMaker.Unity.Campaign.CampaignMapScreen.Show(TDMaker.Unity.Campaign.CampaignProgress%2cTDMaker.Unity.Campaign.CampaignMapUpdate)"
    data-throw-if-not-resolved="false"></xref> with the slot''s progress and the update returned by <xref href="TDMaker.Unity.Campaign.CampaignProgress.ApplyPending"
    data-throw-if-not-resolved="false"></xref> to highlight

    new stars and newly opened levels. <xref href="TDMaker.Unity.Campaign.CampaignMapScreen.PlayRequested" data-throw-if-not-resolved="false"></xref>
    and <xref href="TDMaker.Unity.Campaign.CampaignMapScreen.BackRequested" data-throw-if-not-resolved="false"></xref> leave
    the screen to the caller.

    Keys: 1-9 select a level, Enter plays it, Esc closes the panel and then goes back. Texts use <xref href="TDMaker.Unity.Localization.HudTexts"
    data-throw-if-not-resolved="false"></xref> keys

    and relabel when the language changes. When the campaign has an <xref href="TDMaker.Unity.Campaign.CampaignAsset.upgradeShop"
    data-throw-if-not-resolved="false"></xref>, a Shop button (with

    the unspent stars as a badge) opens the <xref href="TDMaker.Unity.Campaign.UpgradeShopScreen" data-throw-if-not-resolved="false"></xref>
    over the map.'
  example: []
  syntax:
    content: '[AddComponentMenu("2D Tower Defense Maker/Campaign/World Map Screen")]

      public sealed class CampaignMapScreen : MonoBehaviour'
