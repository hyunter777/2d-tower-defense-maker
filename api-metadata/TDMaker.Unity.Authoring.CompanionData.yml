  name: CompanionData
  nameWithType: CompanionData
  fullName: TDMaker.Unity.Authoring.CompanionData
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'Owner-bound companion slots on a hero or tower, baked into a <xref href="TDMaker.Core.Defs.CompanionDef" data-throw-if-not-resolved="false"></xref>
    (template custom data). Each slot keeps one

    child alive: a ground escort (an ordinary soldier that blocks and follows the owner''s move or rally orders) or a flying
    follower

    (keeps near the owner, never blocks, attacks from where it is). A fallen child is replaced after <xref href="TDMaker.Unity.Authoring.CompanionData.refillDelay"
    data-throw-if-not-resolved="false"></xref>,

    counted from its death. Child damage earns the owner experience.'
