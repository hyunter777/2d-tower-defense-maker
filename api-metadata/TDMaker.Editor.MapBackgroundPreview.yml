  namespace: TDMaker.Editor
  summary: 'Edit-mode stand-in for the painted map: a hidden, never-saved sprite object that shows the level''s ground art
    in the

    Scene view while the Map Editor is open (the Level View only builds the ground in Play mode). It is removed before

    Play mode, assembly reloads and when the Map Editor closes, so scenes and builds never contain it.'
