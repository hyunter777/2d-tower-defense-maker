- uid: TDMaker.Editor.AssetFormatUpgrade.UpgradeAll
  commentId: M:TDMaker.Editor.AssetFormatUpgrade.UpgradeAll
  id: UpgradeAll
  parent: TDMaker.Editor.AssetFormatUpgrade
  langs:
  - csharp
  - vb
  name: UpgradeAll()
  nameWithType: AssetFormatUpgrade.UpgradeAll()
  fullName: TDMaker.Editor.AssetFormatUpgrade.UpgradeAll()
  type: Method
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Upgrades every outdated maker asset with <xref href="TDMaker.Unity.Authoring.AssetSchema.Upgrade(UnityEngine.Object)"
    data-throw-if-not-resolved="false"></xref>, marks it dirty and saves once at the end.

    Newer assets are skipped. Logs a one-line summary.'
  example: []
  syntax:
    content: public static UpgradeReport UpgradeAll()
    return:
      type: TDMaker.Editor.UpgradeReport
    content.vb: Public Shared Function UpgradeAll() As UpgradeReport
  overload: TDMaker.Editor.AssetFormatUpgrade.UpgradeAll*
