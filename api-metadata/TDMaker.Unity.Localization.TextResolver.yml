  fullName: TDMaker.Unity.Localization.TextResolver
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Localization
  summary: 'Resolves text keys for the selected language. Lookup order: the optional custom <xref href="TDMaker.Unity.Localization.TextResolver.Provider"
    data-throw-if-not-resolved="false"></xref>, the

    <xref href="TDMaker.Unity.Localization.TextResolver.Tables" data-throw-if-not-resolved="false"></xref> of the selected
    <xref href="TDMaker.Unity.Localization.TextResolver.Language" data-throw-if-not-resolved="false"></xref>, the English
    tables, the built-in English texts

    (<xref href="TDMaker.Unity.Localization.HudTexts.English" data-throw-if-not-resolved="false"></xref>), then the caller''s
    fallback, then the key itself. The merged table is rebuilt only when

    the language, the table list or a table changes; lookups do not allocate. <xref href="TDMaker.Unity.Localization.TextResolver.Version"
    data-throw-if-not-resolved="false"></xref> changes on every rebuild,

    so views can cache formatted strings and refresh them only then. The scene''s instance is

    <xref href="TDMaker.Unity.View.TDGameSettings.Texts" data-throw-if-not-resolved="false"></xref>.'
  example: []
  syntax:
    content: public sealed class TextResolver
    content.vb: Public NotInheritable Class TextResolver
