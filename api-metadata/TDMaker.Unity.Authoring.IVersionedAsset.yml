- uid: TDMaker.Unity.Authoring.IVersionedAsset
  commentId: T:TDMaker.Unity.Authoring.IVersionedAsset
  id: IVersionedAsset
  parent: TDMaker.Unity.Authoring
  children:
  - TDMaker.Unity.Authoring.IVersionedAsset.SchemaVersion
  langs:
  - csharp
  - vb
  name: IVersionedAsset
  nameWithType: IVersionedAsset
  fullName: TDMaker.Unity.Authoring.IVersionedAsset
  type: Interface
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: An authored asset that carries a serialized schema version and takes part in <xref href="TDMaker.Unity.Authoring.AssetSchema"
    data-throw-if-not-resolved="false"></xref> migrations.
  remarks: 'Every built-in content asset implements this. To version your own standalone <xref href="UnityEngine.ScriptableObject"
    data-throw-if-not-resolved="false"></xref>:


    <ol><li>add <code>[SerializeField, HideInInspector] private int schemaVersion;</code> with <b>no initializer</b> (it must
    read 0 on old files)

    and implement <xref href="TDMaker.Unity.Authoring.IVersionedAsset.SchemaVersion" data-throw-if-not-resolved="false"></xref>
    over it;</li><li>implement <xref href="UnityEngine.ISerializationCallbackReceiver" data-throw-if-not-resolved="false"></xref>
    and call <xref href="TDMaker.Unity.Authoring.AssetSchema.HandleBeforeSerialize(TDMaker.Unity.Authoring.IVersionedAsset)"
    data-throw-if-not-resolved="false"></xref> and

    <xref href="TDMaker.Unity.Authoring.AssetSchema.HandleAfterDeserialize(TDMaker.Unity.Authoring.IVersionedAsset)" data-throw-if-not-resolved="false"></xref>
    from it;</li><li>register steps with <xref href="TDMaker.Unity.Authoring.AssetSchema.RegisterStep%60%601(System.Int32%2cSystem.Action%7b%60%600%7d)"
    data-throw-if-not-resolved="false"></xref> from the type''s static constructor.</li></ol>


    For a subclass of a built-in base (for example <xref href="TDMaker.Unity.Authoring.TemplateExtensionAsset" data-throw-if-not-resolved="false"></xref>),
    implement

    <xref href="TDMaker.Unity.Authoring.ISubclassVersionedAsset" data-throw-if-not-resolved="false"></xref> instead; the base
    already handles the callbacks.'
  example: []
  syntax:
    content: public interface IVersionedAsset
    content.vb: Public Interface IVersionedAsset
