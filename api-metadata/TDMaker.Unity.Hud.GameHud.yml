- uid: TDMaker.Unity.Hud.GameHud.SetNavigation(System.Boolean,System.Boolean,System.String,System.String)
  commentId: M:TDMaker.Unity.Hud.GameHud.SetNavigation(System.Boolean,System.Boolean,System.String,System.String)
  id: SetNavigation(System.Boolean,System.Boolean,System.String,System.String)
  parent: TDMaker.Unity.Hud.GameHud
  langs:
  - csharp
  - vb
  name: SetNavigation(bool, bool, string, string)
  nameWithType: GameHud.SetNavigation(bool, bool, string, string)
  fullName: TDMaker.Unity.Hud.GameHud.SetNavigation(bool, bool, string, string)
  type: Method
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Hud
  summary: 'For flow scripts that add <xref href="TDMaker.Unity.Hud.GameHud.onContinue" data-throw-if-not-resolved="false"></xref>/<xref
    href="TDMaker.Unity.Hud.GameHud.onQuit" data-throw-if-not-resolved="false"></xref> listeners from code (runtime listeners
    are

    not visible to the default "show when the inspector has a listener" rule): chooses which navigation buttons the

    result screen and pause menu show, and their labels. With both shown, the result screen puts Quit and Continue side by
    side.

    The labels are text keys (looked up in <xref href="TDMaker.Unity.Hud.GameHud.Texts" data-throw-if-not-resolved="false"></xref>)
    or literal texts; empty uses <xref href="TDMaker.Unity.Localization.HudTexts.NavContinue" data-throw-if-not-resolved="false"></xref>
    /

    <xref href="TDMaker.Unity.Localization.HudTexts.NavQuit" data-throw-if-not-resolved="false"></xref>.'
  example: []
  syntax:
    content: public void SetNavigation(bool showContinue, bool showQuit, string continueText = "hud.nav.continue", string
      quitText = "hud.nav.quit")
    parameters:
    - id: showContinue
      type: System.Boolean
    - id: showQuit
      type: System.Boolean
    - id: continueText
      type: System.String
    - id: quitText
      type: System.String
    content.vb: Public Sub SetNavigation(showContinue As Boolean, showQuit As Boolean, continueText As String = "hud.nav.continue",
      quitText As String = "hud.nav.quit")
  overload: TDMaker.Unity.Hud.GameHud.SetNavigation*
  nameWithType.vb: GameHud.SetNavigation(Boolean, Boolean, String, String)
  fullName.vb: TDMaker.Unity.Hud.GameHud.SetNavigation(Boolean, Boolean, String, String)
  name.vb: SetNavigation(Boolean, Boolean, String, String)
