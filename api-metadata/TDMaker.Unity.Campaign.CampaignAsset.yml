  name: CampaignAsset
  nameWithType: CampaignAsset
  fullName: TDMaker.Unity.Campaign.CampaignAsset
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Campaign
  summary: 'A campaign: ordered levels on a world map with unlock rules (previous level, a list of required levels, an optional
    star

    gate, side branches that never block the main path) and the map picture. Progress lives in a save slot

    (<xref href="TDMaker.Unity.Campaign.ProfileData" data-throw-if-not-resolved="false"></xref>, read through <xref href="TDMaker.Unity.Campaign.CampaignProgress"
    data-throw-if-not-resolved="false"></xref>); this asset only describes the campaign.

    Edit it in the inspector: click in the map view to place level points, and the inspector lists validation problems.'
  example: []
  syntax:
    content: '[CreateAssetMenu(menuName = "2D Tower Defense Maker/Campaign", fileName = "Campaign", order = 2)]

      public sealed class CampaignAsset : ScriptableObject'
    content.vb: '<CreateAssetMenu(menuName:="2D Tower Defense Maker/Campaign", fileName:="Campaign", order:=2)>

      Public NotInheritable Class CampaignAsset Inherits ScriptableObject'
