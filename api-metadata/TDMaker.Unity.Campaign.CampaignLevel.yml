  summary: 'A side level: it does not block the main path (levels using <xref href="TDMaker.Unity.Campaign.CampaignUnlock.PreviousLevel"
    data-throw-if-not-resolved="false"></xref> skip it when looking

    for their previous level). A branch with <xref href="TDMaker.Unity.Campaign.CampaignUnlock.PreviousLevel" data-throw-if-not-resolved="false"></xref>
    opens after the main level before it.'
  example: []
  syntax:
    content: '[Tooltip("Side level: it never blocks the main path. With Previous Level it opens after the main level listed
      before it.")]

