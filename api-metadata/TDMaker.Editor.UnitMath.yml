  langs:
  - csharp
  - vb
  name: UnitMath
  nameWithType: UnitMath
  fullName: TDMaker.Editor.UnitMath
  type: Class
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Unit Workshop numbers that follow the simulation''s integer damage rules exactly (single-target hits without status
    effects

    or incoming multipliers): a hit rolls <code>ceil(lerp(min, max, u))</code>, projectile hits deal at least 1, the target
    keeps

    <code>floor(rolled × (1 − reduction))</code> (soldiers: <code>round(rolled − floor(rolled × reduction))</code>), and the
    reduction is the

    matching defense minus pierce (explosion and electric use half the physical armor), clamped to [0, 1].

    Ratio checks use the bands of the balance notes (new content starting points, not rules).'
  example: []
  syntax:
    content: public static class UnitMath
    content.vb: Public Module UnitMath
