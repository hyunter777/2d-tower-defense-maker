  name: LevelDryRun
  nameWithType: LevelDryRun
  fullName: TDMaker.Editor.LevelDryRun
  type: Class
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Headless content check: bakes a level and runs the simulation without rendering.

    The undefended run calls every wave as early as possible with no towers (shows total threat);

    the fortified run builds and upgrades towers on every slot with unlimited gold, buys every tower ability,

    spawns the level''s heroes (moving them to the front enemy and spending skill points), and casts ready spells

    at the leading enemy (checks that every build, branch, rally, ability, move and cast is accepted and that the

    level can be completed). The budget pass plays with the level''s real starting gold: it starts the first wave, lets later

    waves arrive on their timers and spends gold greedily (builds slots in list order, cycling the buildable towers, then
    the

    cheapest upgrade, branch or ability rank), with the same hero and spell assistance (checks that a sensible defense wins).'
  example: []
  syntax:
    content: public static class LevelDryRun
    content.vb: Public Module LevelDryRun
