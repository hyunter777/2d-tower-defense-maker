  name: RegisterStep<T>(int, Action<T>)
  nameWithType: AssetSchema.RegisterStep<T>(int, Action<T>)
  fullName: TDMaker.Unity.Authoring.AssetSchema.RegisterStep<T>(int, System.Action<T>)
  type: Method
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'Registers a migration step that brings <code class="typeparamref">T</code> data from <code class="paramref">fromVersion</code>
    to <code class="paramref">fromVersion</code> + 1.

    Call it from <code class="typeparamref">T</code>''s static constructor. Several steps at the same version run in registration
    order.'
  example: []
  syntax:
    content: 'public static void RegisterStep<T>(int fromVersion, Action<T> step) where T : class, IVersionedAsset'
    parameters:
    - id: fromVersion
      type: System.Int32
      description: The version the step reads (0 = data from before versioning).
    - id: step
      type: System.Action{{T}}
      description: The conversion. It must be idempotent and must not call Unity API (see the class remarks).
    typeParameters:
    - id: T
      description: The asset type the step converts. If it implements <xref href="TDMaker.Unity.Authoring.ISubclassVersionedAsset"
        data-throw-if-not-resolved="false"></xref>, the step runs on the subclass track.
    content.vb: Public Shared Sub RegisterStep(Of T As {Class, IVersionedAsset})(fromVersion As Integer, [step] As Action(Of
      T))
  overload: TDMaker.Unity.Authoring.AssetSchema.RegisterStep*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: A subclass of a built-in base registers on the framework track; implement <xref href="TDMaker.Unity.Authoring.ISubclassVersionedAsset"
      data-throw-if-not-resolved="false"></xref>.
  nameWithType.vb: AssetSchema.RegisterStep(Of T)(Integer, Action(Of T))
  fullName.vb: TDMaker.Unity.Authoring.AssetSchema.RegisterStep(Of T)(Integer, System.Action(Of T))
