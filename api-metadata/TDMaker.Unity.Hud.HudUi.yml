  summary: 'A shared material for <code class="paramref">font</code>: <code class="paramref">preset</code> (or the font''s
    material) with an optional drop

    shadow (underlay) and outline (<code class="paramref">outlineWidth</code> 0..1 of the SDF range, 0 = none). Cached, so
    labels with the

    same look share one material and keep batching. Effects the shader does not support are skipped.'
