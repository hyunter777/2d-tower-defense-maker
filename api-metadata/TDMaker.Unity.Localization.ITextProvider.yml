  namespace: TDMaker.Unity.Localization
  summary: 'A source of user-visible text by key. <xref href="TDMaker.Unity.Localization.TextTable" data-throw-if-not-resolved="false"></xref>
    assets implement it; implement it yourself to feed the HUD from

    another system (for example the Unity Localization package or a spreadsheet import) and assign it to

    <xref href="TDMaker.Unity.Localization.TextResolver.Provider" data-throw-if-not-resolved="false"></xref>. Lookups happen
    when a label changes, not every frame, but should not allocate.'
  example: []
