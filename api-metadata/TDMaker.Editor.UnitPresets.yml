    - id: asset
      type: TDMaker.Unity.Authoring.EntityAssetBase
    - id: preset
      type: TDMaker.Editor.UnitPreset
    - id: b
      type: TDMaker.Editor.UnitPresets.Baseline
    - id: companion
      type: TDMaker.Unity.Authoring.EnemyAsset
