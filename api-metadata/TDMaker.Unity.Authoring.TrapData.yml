  name: TrapData
  nameWithType: TrapData
  fullName: TDMaker.Unity.Authoring.TrapData
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'A fixed-position deployment (mine, snare, glyph) placed by an ability action, baked into <xref href="TDMaker.Core.Defs.TrapDef"
    data-throw-if-not-resolved="false"></xref>.

    It arms after a delay, then hits the nearest eligible unit inside its detection radius until its triggers or lifetime
    run out.

    Use it as an ability action (<xref href="TDMaker.Unity.Authoring.AbilityActionData.useTrap" data-throw-if-not-resolved="false"></xref>).'
