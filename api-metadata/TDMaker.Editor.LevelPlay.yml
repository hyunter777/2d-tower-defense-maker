- uid: TDMaker.Editor.LevelPlay.CanPlay(TDMaker.Unity.Authoring.LevelAsset,System.String@)
  commentId: M:TDMaker.Editor.LevelPlay.CanPlay(TDMaker.Unity.Authoring.LevelAsset,System.String@)
  id: CanPlay(TDMaker.Unity.Authoring.LevelAsset,System.String@)
  parent: TDMaker.Editor.LevelPlay
  langs:
  - csharp
  - vb
  name: CanPlay(LevelAsset, out string)
  nameWithType: LevelPlay.CanPlay(LevelAsset, out string)
  fullName: TDMaker.Editor.LevelPlay.CanPlay(TDMaker.Unity.Authoring.LevelAsset, out string)
  type: Method
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Whether <xref href="TDMaker.Editor.LevelPlay.Play(TDMaker.Unity.Authoring.LevelAsset)" data-throw-if-not-resolved="false"></xref>
    can start <code class="paramref">level</code> now. <code class="paramref">reason</code> is a tooltip: what the button
    does,

    or why it is disabled. Cheap (no scene search), so windows may call it on every refresh.'
  example: []
  syntax:
    content: public static bool CanPlay(LevelAsset level, out string reason)
    parameters:
    - id: level
      type: TDMaker.Unity.Authoring.LevelAsset
    - id: reason
      type: System.String
    return:
      type: System.Boolean
    content.vb: Public Shared Function CanPlay(level As LevelAsset, reason As String) As Boolean
  overload: TDMaker.Editor.LevelPlay.CanPlay*
