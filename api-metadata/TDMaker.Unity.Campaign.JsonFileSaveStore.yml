  fullName: TDMaker.Unity.Campaign.JsonFileSaveStore
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Campaign
  summary: 'Default store: one JSON file per slot under <xref href="UnityEngine.Application.persistentDataPath" data-throw-if-not-resolved="false"></xref>
    (folder <code>TDMakerSaves</code>, files

    <code>slot1.json</code>, <code>slot2.json</code>, ...). Writes go to a temporary file that then replaces the slot file,
    so a crash

    mid-write leaves the previous save intact. An unreadable file is renamed to <code>slotN.json.bak</code> (or <code>.bak2</code>,
    ...)

    and kept. Not for WebGL (use <xref href="TDMaker.Unity.Campaign.PlayerPrefsSaveStore" data-throw-if-not-resolved="false"></xref>,
    or <xref href="TDMaker.Unity.Campaign.SaveStoreFactory.CreateDefault(System.Int32%2cSystem.String)" data-throw-if-not-resolved="false"></xref>).'
  example: []
  syntax:
    content: 'public sealed class JsonFileSaveStore : TextSaveStore, ISaveStore'
    content.vb: Public NotInheritable Class JsonFileSaveStore Inherits TextSaveStore Implements ISaveStore
