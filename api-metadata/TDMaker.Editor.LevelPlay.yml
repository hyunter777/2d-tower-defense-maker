  name: LevelPlay
  nameWithType: LevelPlay
  fullName: TDMaker.Editor.LevelPlay
  type: Class
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: "\"Play this level\": saves, opens the saved scene that plays the level (or a temporary unsaved scene with the
    game rig when no\r\nscene does) and enters Play mode. When Play mode stops, the scenes that were open before are opened
    again. Modelled on\r\n<xref href=\"TDMaker.Editor.UnitSandboxPlay\" data-throw-if-not-resolved=\"false\"></xref> (same
    scene capture and restore); nothing is written to disk except the saves the user agrees to."
  example: []
  syntax:
    content: '[InitializeOnLoad]

      public static class LevelPlay'
    content.vb: '<InitializeOnLoad>

      Public Module LevelPlay'
  inheritance:
