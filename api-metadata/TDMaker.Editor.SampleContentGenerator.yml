  langs:
  - csharp
  - vb
  name: SampleContentGenerator
  nameWithType: SampleContentGenerator
  fullName: TDMaker.Editor.SampleContentGenerator
  type: Class
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Generates the "Basic" sample: projectiles, enemies, soldiers, four tower families, five waves on two

    multi-lane paths, status effects (slow, poison, stun, rally buff, shield ward), purchasable abilities on final branches

    (including a chain-lightning ability, a knockback ability, a channelled beam, a path-transfer rift and a trap-laying barracks),

    a support enemy with a shield cast and a permanent pulse-only healing aura, an armored enemy that reflects damage,

    one hero (with life steal and a trap skill), two spells (reinforcement and area strike), a level asset and a ready-to-play
    scene.

    All content is original and uses hand-authored vector art with procedural fallbacks; the scene uses the uGUI <xref href="TDMaker.Unity.Hud.GameHud"
    data-throw-if-not-resolved="false"></xref> with a theme asset,

    a fitted camera, a painted ground and the IMGUI HUD as an F1 debug overlay. Re-running updates the existing assets in
    place.

    The same run also generates the Crossroads and Winding Pass levels (which reuse the Basic towers, enemies and hero) and
    the

    Demo scene (title, level select, pause and result flow over all three levels), plus the English and Korean sample string
    tables

    (Samples/Text) that every sample scene''s Game Settings use, and the dynamic Korean fallback font asset of the sample
    HUD themes

    (Samples/Fonts).'
  example: []
  syntax:
    content: public static class SampleContentGenerator
    content.vb: Public Module SampleContentGenerator
