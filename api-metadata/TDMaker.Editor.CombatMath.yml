- uid: TDMaker.Editor.CombatMath.Reduction(TDMaker.Core.Defs.DamageKind,System.Single,System.Single,System.Single)
  commentId: M:TDMaker.Editor.CombatMath.Reduction(TDMaker.Core.Defs.DamageKind,System.Single,System.Single,System.Single)
