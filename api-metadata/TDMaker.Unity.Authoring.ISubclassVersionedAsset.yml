items:
- uid: TDMaker.Unity.Authoring.ISubclassVersionedAsset
  commentId: T:TDMaker.Unity.Authoring.ISubclassVersionedAsset
  id: ISubclassVersionedAsset
  parent: TDMaker.Unity.Authoring
  children:
  - TDMaker.Unity.Authoring.ISubclassVersionedAsset.SubclassSchemaVersion
  langs:
  - csharp
  - vb
  name: ISubclassVersionedAsset
  nameWithType: ISubclassVersionedAsset
  fullName: TDMaker.Unity.Authoring.ISubclassVersionedAsset
  type: Interface
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'A second, independent version track for your own subclass of a built-in asset base (<xref href="TDMaker.Unity.Authoring.EntityAssetBase"
    data-throw-if-not-resolved="false"></xref>,

    <xref href="TDMaker.Unity.Authoring.AbilityActionAsset" data-throw-if-not-resolved="false"></xref>, <xref href="TDMaker.Unity.Authoring.TemplateExtensionAsset"
    data-throw-if-not-resolved="false"></xref>). The base''s <xref href="TDMaker.Unity.Authoring.IVersionedAsset.SchemaVersion"
    data-throw-if-not-resolved="false"></xref>

    belongs to the framework, so your fields are versioned here and later framework updates cannot collide with your step
    numbers.'
  remarks: 'Back it with <code>[SerializeField, HideInInspector] private int mySchemaVersion;</code> (no initializer). Steps
    registered with

    <xref href="TDMaker.Unity.Authoring.AssetSchema.RegisterStep%60%601(System.Int32%2cSystem.Action%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref>
    for a type implementing this interface run on this track, after the framework''s own steps.

    If your subclass implements <xref href="UnityEngine.ISerializationCallbackReceiver" data-throw-if-not-resolved="false"></xref>
    itself, it replaces the base implementation:

    call <xref href="TDMaker.Unity.Authoring.AssetSchema.HandleBeforeSerialize(TDMaker.Unity.Authoring.IVersionedAsset)" data-throw-if-not-resolved="false"></xref>
    / <xref href="TDMaker.Unity.Authoring.AssetSchema.HandleAfterDeserialize(TDMaker.Unity.Authoring.IVersionedAsset)" data-throw-if-not-resolved="false"></xref>
    from yours.'
  example: []
  syntax:
    content: public interface ISubclassVersionedAsset
    content.vb: Public Interface ISubclassVersionedAsset
