  langs:
  - csharp
  - vb
  name: RaiseRemainsData
  nameWithType: RaiseRemainsData
  fullName: TDMaker.Unity.Authoring.RaiseRemainsData
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'Raises new units from the bodies the fallen leave behind, baked into a <xref href="TDMaker.Core.Defs.RaiseRemainsDef"
    data-throw-if-not-resolved="false"></xref>. Each activation reserves the

    closest eligible bodies (ties by body order), casts for <xref href="TDMaker.Unity.Authoring.RaiseRemainsData.castDelay"
    data-throw-if-not-resolved="false"></xref>, then consumes each body and creates

    <xref href="TDMaker.Unity.Authoring.RaiseRemainsData.unit" data-throw-if-not-resolved="false"></xref> there (an enemy
    continues the body''s path; a soldier fights for the player). A moved, stunned or dead caster

    releases its reservations. Bodies decay after the runner''s Remains Lifetime. Use it as an ability action

    (<xref href="TDMaker.Unity.Authoring.AbilityActionData.useRaise" data-throw-if-not-resolved="false"></xref>).'
  example: []
  syntax:
    content: public sealed class RaiseRemainsData
    content.vb: Public NotInheritable Class RaiseRemainsData
  inheritance:
  - System.Object
  inheritedMembers:
  - System.Object.GetType
