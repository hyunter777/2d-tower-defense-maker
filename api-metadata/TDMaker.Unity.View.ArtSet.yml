  summary: 'A swappable set of sprites keyed by view key (template view keys and projectile view keys). Assign one to an

    <xref href="TDMaker.Unity.View.EntityViewRegistry" data-throw-if-not-resolved="false"></xref> to draw units, towers and
    projectiles with these sprites instead of the generated

    primitives; anything without an entry keeps its prefab or primitive look, so partial sets are fine. Swapping the asset

    swaps the whole look without code changes. Also carries the build plot sprite drawn by <xref href="TDMaker.Unity.View.LevelView"
    data-throw-if-not-resolved="false"></xref>.

    Create one with <code>Assets/Create/2D Tower Defense Maker/Art Set</code>.'
