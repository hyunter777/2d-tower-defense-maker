- uid: TDMaker.Editor.LevelPlay.Play(TDMaker.Unity.Authoring.LevelAsset)
  commentId: M:TDMaker.Editor.LevelPlay.Play(TDMaker.Unity.Authoring.LevelAsset)
  id: Play(TDMaker.Unity.Authoring.LevelAsset)
  parent: TDMaker.Editor.LevelPlay
  langs:
  - csharp
  - vb
  name: Play(LevelAsset)
  nameWithType: LevelPlay.Play(LevelAsset)
  fullName: TDMaker.Editor.LevelPlay.Play(TDMaker.Unity.Authoring.LevelAsset)
  type: Method
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Saves the level and the maker assets, asks to save modified scenes (cancel stops), then plays the level: in the
    saved scene

    that starts it, or in a temporary unsaved scene built for it. Ignored while playing or when <code class="paramref">level</code>
    is null.'
  example: []
  syntax:
    content: public static void Play(LevelAsset level)
    parameters:
    - id: level
      type: TDMaker.Unity.Authoring.LevelAsset
    content.vb: Public Shared Sub Play(level As LevelAsset)
  overload: TDMaker.Editor.LevelPlay.Play*
