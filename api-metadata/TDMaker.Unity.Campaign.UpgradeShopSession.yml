  langs:
  - csharp
  - vb
  name: UpgradeShopSession
  nameWithType: UpgradeShopSession
  fullName: TDMaker.Unity.Campaign.UpgradeShopSession
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Campaign
  summary: 'One visit of the star-upgrade shop over a save slot. Every rule comes from the core <xref href="TDMaker.Core.UpgradeShopRules"
    data-throw-if-not-resolved="false"></xref>:

    only the next rank of a track can be bought and only with enough stars (<code>Available = EarnedTotal − Spent</code>);
    opening the

    session copies the purchases as the revert baseline; <xref href="TDMaker.Unity.Campaign.UpgradeShopSession.Revert" data-throw-if-not-resolved="false"></xref>
    returns to that baseline (not one step back);

    <xref href="TDMaker.Unity.Campaign.UpgradeShopSession.ResetAll" data-throw-if-not-resolved="false"></xref> clears every
    purchase and makes the cleared state the new baseline. Each change is written into the

    slot''s <xref href="TDMaker.Unity.Campaign.ProfileData" data-throw-if-not-resolved="false"></xref> (ranks per track key
    and stars spent) and saved at once through <xref href="TDMaker.Unity.Campaign.UpgradeShopSession.Save" data-throw-if-not-resolved="false"></xref>.'
  example: []
  syntax:
    content: public sealed class UpgradeShopSession
    content.vb: Public NotInheritable Class UpgradeShopSession
