  namespace: TDMaker.Editor
  summary: 'Mirrors the simulation''s spawn schedule: a group''s entries run back to back; an entry entered at <code>s</code>

    with start delay <code>d</code>, interval <code>h</code> and count <code>n</code> spawns at <code>s+d+h … s+d+nh</code>,
    waits one more

    interval, then the next entry is entered after the following gap.'
