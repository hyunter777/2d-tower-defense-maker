  fullName: TDMaker.Unity.Hud.ClickPicking
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Hud
  summary: 'Battlefield click-target rules used by <xref href="TDMaker.Unity.Hud.GameHud" data-throw-if-not-resolved="false"></xref>
    (input grammar, spec 14 §1): every clickable thing has an

    axis-aligned world rectangle placed relative to its reference point; a click hits it only strictly inside (the border

    is excluded). Among the hits the higher selection priority wins, then the lower world reference point (smaller y).

    Equal priority and equal y keep the first candidate found.'
  example: []
  syntax:
    content: public static class ClickPicking
    content.vb: Public Module ClickPicking
