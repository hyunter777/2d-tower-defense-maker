  summary: Copies this region with no timed expiry. Emission requires a living source; fixed-position ownership is allowed
    by passing false.
  remarks: Attached-effect durations still control occupancy refresh and exit linger. This changes the emitter lifetime only.
  example:
  - <pre><code class="lang-csharp">new AuraDef(area.WithOwnerLifetime());</code></pre>
