  summary: 'Caches the string for an integer so frequently updated labels do not allocate: the text of every value seen is
    kept

    (<xref href="TDMaker.Unity.Hud.NumberText" data-throw-if-not-resolved="false"></xref>; with a prefix or suffix, per cache),
    so a value that comes back costs nothing.'
