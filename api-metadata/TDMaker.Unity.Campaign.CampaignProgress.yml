  namespace: TDMaker.Unity.Campaign
  summary: 'Map entry in one call: merges pending victories and opens levels whose rules hold (<xref href="TDMaker.Unity.Campaign.CampaignProgress.ApplyPending"
    data-throw-if-not-resolved="false"></xref> runs

    <xref href="TDMaker.Unity.Campaign.CampaignProgress.Refresh" data-throw-if-not-resolved="false"></xref> itself). Save
    the slot afterwards when <xref href="TDMaker.Unity.Campaign.CampaignMapUpdate.HasChanges" data-throw-if-not-resolved="false"></xref>
    is true.'
