  name: TextMeshProSetup
  nameWithType: TextMeshProSetup
  fullName: TDMaker.Editor.TextMeshProSetup
  type: Class
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'TextMesh Pro setup check. The HUD, damage numbers and sample menus use TextMesh Pro (part of the uGUI package
    in

    Unity 6), which needs its "Essential Resources" (default font asset, shaders, settings) imported into the project once.

    2D Tower Defense Maker does not ship those resources. When they are missing this class logs one clear message per editor
    session,

    offers a one-click import in a dialog, and is available as <code>Tools &gt; 2D Tower Defense Maker &gt; Import TMP Essential
    Resources</code>

    (also used by the Validator).'
  example: []
  syntax:
    content: '[InitializeOnLoad]

      public static class TextMeshProSetup'
    content.vb: '<InitializeOnLoad>

      Public Module TextMeshProSetup'
