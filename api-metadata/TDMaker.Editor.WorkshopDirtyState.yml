  fullName: TDMaker.Editor.WorkshopDirtyState
  type: Class
  assemblies:
  - TDMaker.Editor
  namespace: TDMaker.Editor
  summary: 'Remembers the last saved (clean) state of the assets an editor window edits, so that Undo back to that state clears
    the

    "modified" mark again (Unity keeps an asset dirty after Undo), and so that unsaved edits can be discarded on request.

    Snapshots are taken once per clean period (when an asset is first seen not dirty), not every frame.'
