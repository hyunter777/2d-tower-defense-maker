  name: RangeShape
  nameWithType: RangeShape
  fullName: TDMaker.Unity.Authoring.RangeShape
  type: Class
  assemblies:
  - TDMaker.Unity
  namespace: TDMaker.Unity.Authoring
  summary: 'The single source of the range ellipse used by every view, gizmo and editor preview. It matches the simulation

    (<code>Simulation.RangeDistanceSquared</code>): a point is inside when <code>dx²/r² + dy²/(k·r)² ≤ 1</code> (boundary
    included),

    with <code>k</code> = range Y scale. The horizontal semi-axis is <code>r</code> and the vertical semi-axis is <code>k·r</code>,

    so <code>k &lt; 1</code> flattens the ellipse vertically (an oblique top-down look).'
  example: []
  syntax:
    content: public static class RangeShape
    content.vb: Public Module RangeShape
